<style>

#themes i{width:34px;height:24px;border-radius:6px;border:1px solid var(--dim);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-family:Georgia,serif;flex:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.4 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}

#board .brow{display:flex;gap:12px;align-items:baseline;margin-bottom:12px}#board .bl{width:5.2em;flex:none;color:var(--dim)}#board .chips{display:flex;flex-wrap:wrap;gap:4px 12px}

.fact:hover .cp,.cp:focus-visible{opacity:.6} .cp:hover{opacity:1!important;color:var(--ink)} .cp.ok{opacity:1;color:var(--ink)} .cp.ok svg{display:none} .cp.ok::after{content:"✓";font-size:14px}

    say.append('So we’re fine with' + (w.length ? ' ' : '…')); w.forEach((x, i) => { const b = el('b', 'back1', x); b.setAttribute('role', 'button'); b.tabIndex = 0; b.title = 'Step back to here';
      /* tapping a word in the sentence steps back to that choice, which is the way home on a phone where earlier columns scroll away */
      b.onclick = () => { for(let k = i; k < 3; k++) sel[k] = null; ki = null; render(); S.scrollTo({left: 0, behavior: reduced ? 'auto' : 'smooth'}); };
      say.append(b, i === w.length - 1 ? '?' : ', '); }); }
  /* the sound belongs to the list, not the click: each new item that drops in pops, a little higher than the last */
  function patter(){ if(reduced) return; const g = cols().filter(c => c.classList.contains('grow') && c.children.length); if(!g.length) return;
    const c = g[0], n = Math.min(c.children.length, 12), d = cols().indexOf(c);
    for(let i = 0; i < n; i++) setTimeout(() => SND.tick([.85, .95, 1.05, 1.15][d] + i*.035), 280 + i*30); }
  function filter(q){ QRY = q; for(let d = 0; d < 3; d++){ if(sel[d] != null && !items(d).some(x => x.i === sel[d])) for(let k = d; k < 3; k++) sel[k] = null; } drawn = ''; render(); }
  addEventListener('resize', () => { if(S.classList.contains('on')){ place(); wire(-1); } });
  return {start(){ render(); }, open(p){ sel = [p[0], p[1], p[2]]; drawn = ''; render(); }, filter, enter(){}, shown(){ ph('search…'); place(); wire(-1); }};
})();

/* =================== switching between the three layouts =================== */
const small = () => innerWidth <= 760;
let mode = 'outl'; try { const m = localStorage.getItem('sr-layout3'); if(m === 'wheel') mode = 'sent'; else if(['sent','outl','stem'].includes(m)) mode = m; } catch(e){}
const real = () => mode, MOD = {sent: T, outl: OL, stem: SM};
function show(m){ if(m) mode = m; fhint(''); try { localStorage.setItem('sr-layout3', mode); } catch(e){} const r = real();
  ['sent','outl','stem'].forEach(k => $(k).classList.toggle('on', k === r)); MOD[r].shown(); if(typeof applyQ === 'function') applyQ();
  const sw = $('sw'); sw.innerHTML = ''; [['outl', 'outline'], ['sent', 'sentence'], ['stem', 'stems']].forEach(([k, n]) => { const b = el('button', null, n); b.setAttribute('aria-pressed', String(k === real())); b.onclick = () => show(k); sw.appendChild(b); }); }
let lastSmall = small(); addEventListener('resize', () => { if(small() !== lastSmall){ lastSmall = small(); show(); } });
T.start(); OL.start(); SM.start(); show();
const IDX = []; P.forEach((s,si) => s.u.forEach((u,gi) => u.t.forEach(ti => IDX.push({p:[si,gi,ti], n:s.t[ti].t, low:nrm(s.t[ti].t), k:s.t[ti].k.map(k => nrm(k.f))}))));
/* anywhere-search, used when the layer you're on has nothing by that name */
function deep(q, scope){ return IDX.filter(x => (!scope || scope.every((v,j) => x.p[j] === v))).map(x => [x, x.low.startsWith(q) ? 3 : x.low.includes(q) ? 2 : q.length > 2 && x.k.some(k => k.includes(q)) ? 1 : 0]).filter(h => h[1]).sort((a,b) => b[1] - a[1]).map(h => h[0]); }
let jumpTo = null;
function searchNote(){ if(!QRY) return ''; const n = totalHits(); if(!n) return 'nothing mentions that'; const subs = new Set([...hits()].map(k => k.split('.')[0])).size;
  return 'in ' + plural(subs, W[0]) + ' · ' + plural(n, W[2]); }
function jumpHint(){ const h = deep(QRY)[0]; jumpTo = h ? h.p : null; return h ? ' · ↵ opens “' + h.n + '”' : ''; }
function jump(){ if(!jumpTo) return; const p = jumpTo; setQ(''); F.blur(); MOD[real()].open(p); }
/* one search for the whole site: the words in the box are always the words doing the culling, in every layout */
function applyQ(){ const M = MOD[real()]; if(M._q !== QRY){ M._q = QRY; M.filter(QRY); } }
function setQ(raw){ F.value = raw; const q = nrm(raw.trim()); QRY = q.length > 1 ? q : ''; document.documentElement.classList.toggle('nohits', !!QRY && !totalHits()); applyQ(); if(!QRY) fhint(''); }
const F = $('find');
document.querySelectorAll('.nhback').forEach(b => b.onclick = () => { SND.tick(.8); setQ(''); });
F.addEventListener('input', () => setQ(F.value));
F.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); MOD[real()].enter(); } if(e.key === 'Escape'){ setQ(''); F.blur(); } });
addEventListener('keydown', e => { if(e.key === '/' && e.target !== F){ e.preventDefault(); F.focus(); } });
/* themes: auto follows the device; the rest are fixed palettes. The half-circle opens the list */
(function(){ const r = document.documentElement, box = $('themes');
  const TH = [['', 'auto', '#fff', '#111'], ['day', 'day', '#fff', '#111'], ['night', 'night', '#0b0b0b', '#ebebeb'], ['paper', 'paper', '#f5efe3', '#2b241d'],
    ['newsprint', 'newsprint', '#ecebe6', '#151515'], ['rose', 'rose', '#fbf1f2', '#3d1f27'], ['ink', 'ink', '#0f2240', '#e9eef6'], ['slate', 'slate', '#1b1f24', '#dfe3e8'], ['phosphor', 'phosphor', '#060b06', '#9cf29c']];
  const set = k => { if(k) r.dataset.theme = k; else delete r.dataset.theme; try { localStorage.setItem('sr-theme', k); } catch(e){} draw(); };
  try { const t = localStorage.getItem('sr-theme'); if(t === null) r.dataset.theme = 'ink'; else if(t && TH.some(x => x[0] === t)) r.dataset.theme = t; else delete r.dataset.theme; } catch(e){ r.dataset.theme = 'ink'; }
  function draw(){ box.innerHTML = ''; const cur = r.dataset.theme || ''; TH.forEach(([k, name, bg, ink]) => { const b = el('button'); b.setAttribute('aria-pressed', String(k === cur));
      const i = el('i', null, 'Aa'); i.style.background = bg; i.style.color = ink; b.append(i, name); b.onclick = () => { set(k); SND.tick(1.2); }; box.appendChild(b); }); }
  $('theme').onclick = e => { e.stopPropagation(); box.classList.toggle('on'); draw(); };
  addEventListener('pointerdown', e => { if(box.classList.contains('on') && !e.target.closest('#themes,#theme')) box.classList.remove('on'); }); })();
</script></body></html>
