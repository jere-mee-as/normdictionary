<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<script>try{var t=localStorage.getItem('sr-theme');if(t===null)document.documentElement.dataset.theme='ink';else if(t)document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='ink'}</script>
<title>Norm Dictionary · granular</title>
<style>
:root{--ink:#111;--dim:#9a9a9a;--faint:#e6e6e6;--bg:#fff;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--ink:#ebebeb;--dim:#6c6c6c;--faint:#222;--bg:#0b0b0b}}
:root[data-theme=night]{--ink:#ebebeb;--dim:#6c6c6c;--faint:#222;--bg:#0b0b0b;color-scheme:dark}
:root[data-theme=paper]{--ink:#2b241d;--dim:#9a8c79;--faint:#e3d9c6;--bg:#f5efe3;color-scheme:light}
:root[data-theme=ink]{--ink:#e9eef6;--dim:#7f93ad;--faint:#22385a;--bg:#0f2240;color-scheme:dark}
:root[data-theme=phosphor]{--ink:#9cf29c;--dim:#3f7f3f;--faint:#163016;--bg:#060b06;color-scheme:dark}
:root[data-theme=phosphor] body,:root[data-theme=phosphor] button,:root[data-theme=phosphor] input{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:-.01em}
:root[data-theme=rose]{--ink:#3d1f27;--dim:#b38791;--faint:#efd8dc;--bg:#fbf1f2;color-scheme:light}
:root[data-theme=slate]{--ink:#dfe3e8;--dim:#7b8590;--faint:#2b3138;--bg:#1b1f24;color-scheme:dark}
:root[data-theme=newsprint]{--ink:#151515;--dim:#8a8a84;--faint:#d9d8d2;--bg:#ecebe6;color-scheme:light}
:root[data-theme=newsprint] body{font-family:"Times New Roman",Times,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.4 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
main{max-width:1120px;margin:0 auto;padding:30px 32px 140px}
/* verdict colors */
.v0{--vc:#1d8a43}.v1{--vc:#3a8a2c}.v2{--vc:#5d8a1f}.v3{--vc:#87881a}.v4{--vc:#a6830d}.v5{--vc:#b86d0c}.v6{--vc:#c2560f}.v7{--vc:#c43d1a}.v8{--vc:#b5231e}
:is([data-theme=night],[data-theme=ink],[data-theme=slate],[data-theme=phosphor]) .v0{--vc:#4fd27a}:is([data-theme=night],[data-theme=ink],[data-theme=slate],[data-theme=phosphor]) .v1{--vc:#72d468}:is([data-theme=night],[data-theme=ink],[data-theme=slate],[data-theme=phosphor]) .v2{--vc:#9cd35d}:is([data-theme=night],[data-theme=ink],[data-theme=slate],[data-theme=phosphor]) .v3{--vc:#c6d156}:is([data-theme=night],[data-theme=ink],[data-theme=slate],[data-theme=phosphor]) .v4{--vc:#e6c44e}:is([data-theme=night],[data-theme=ink],[data-theme=slate],[data-theme=phosphor]) .v5{--vc:#f0a646}:is([data-theme=night],[data-theme=ink],[data-theme=slate],[data-theme=phosphor]) .v6{--vc:#f28844}:is([data-theme=night],[data-theme=ink],[data-theme=slate],[data-theme=phosphor]) .v7{--vc:#f06a45}:is([data-theme=night],[data-theme=ink],[data-theme=slate],[data-theme=phosphor]) .v8{--vc:#ee4a4a}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .v0{--vc:#4fd27a}:root:not([data-theme]) .v1{--vc:#72d468}:root:not([data-theme]) .v2{--vc:#9cd35d}:root:not([data-theme]) .v3{--vc:#c6d156}:root:not([data-theme]) .v4{--vc:#e6c44e}:root:not([data-theme]) .v5{--vc:#f0a646}:root:not([data-theme]) .v6{--vc:#f28844}:root:not([data-theme]) .v7{--vc:#f06a45}:root:not([data-theme]) .v8{--vc:#ee4a4a}}
/* top bar */
.bar{display:flex;align-items:baseline;gap:10px;font-size:14px;color:var(--dim);margin-bottom:44px}
.bar .tab{color:var(--dim)}.bar .tab[aria-pressed=true]{color:var(--ink);border-bottom:1px solid var(--dim)}
.bar .sp{flex:1}.bar .ic{color:var(--dim);font-size:14px}.bar .ic:hover,.bar .tab:hover{color:var(--ink)}
.bar .ic.off{opacity:.45;text-decoration:line-through}
/* build */
.sent{font-size:clamp(28px,3.8vw,46px);line-height:1.45;min-height:1.5em;letter-spacing:-.005em}
.sent .wd{cursor:pointer;border-bottom:1px solid var(--faint);transition:border-color .15s}
.sent .wd:hover{border-color:var(--dim)}
.sent .wd.new{animation:in .4s cubic-bezier(.2,.8,.3,1);display:inline-block}
.sent .gap{color:var(--dim);border-bottom:1px dashed var(--dim);cursor:pointer;animation:blink 1.8s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ask{margin-top:30px}
.ask .q{font-size:15px;color:var(--dim);margin-bottom:12px;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px 10px}
.chip{padding:6px 13px;border:1px solid var(--faint);border-radius:999px;font-size:17px;line-height:1.2;transition:border-color .12s,transform .12s}
.chip:hover,.chip:focus-visible{border-color:var(--dim);outline:none}
.chip:active{transform:scale(.97)}
.chip.on{border-color:var(--ink)}
.chip.sm{font-size:14.5px;padding:4px 11px;color:var(--dim)}.chip.sm:hover{color:var(--ink)}
.grp{font-size:12.5px;color:var(--dim);letter-spacing:.06em;width:100%;margin:12px 0 2px}
.out{margin-top:36px}
.vrow{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.vbig{font-size:clamp(40px,5.6vw,64px);color:var(--vc);transition:color .35s;display:inline-block}
.vbig.pop{animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
.said{color:var(--dim);font-style:italic;font-size:17px}
.strip{margin-top:18px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14.5px}
.strip button{color:var(--dim)}.strip button b{font-weight:400;color:var(--vc);transition:color .35s}
.strip button[aria-pressed=true]{color:var(--ink);border-bottom:1px solid var(--dim)}
.why{margin-top:22px;max-width:44em;font-size:16.5px;line-height:1.55}
.why .r{display:flex;gap:12px}.why .a{width:1.5em;text-align:center;flex:none}
.why .x{color:var(--dim);font-size:13.5px;margin-left:6px}
.why .none,.why .idle{color:var(--dim);font-style:italic;font-size:15px}
.up{color:#f28844}.down{color:#9cd35d}.set{color:#ee4a4a}
:is([data-theme=day],[data-theme=paper],[data-theme=rose],[data-theme=newsprint]) .up{color:#c2560f}:is([data-theme=day],[data-theme=paper],[data-theme=rose],[data-theme=newsprint]) .down{color:#3a8a2c}:is([data-theme=day],[data-theme=paper],[data-theme=rose],[data-theme=newsprint]) .set{color:#b5231e}
.more{margin-top:30px;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:baseline}
.more .lab{font-size:13px;color:var(--dim);text-align:right}
.tools{margin-top:34px;display:flex;gap:22px;font-size:14px;color:var(--dim)}
.tools button:hover{color:var(--ink)}
/* cryptex */
.cxw{--rh:220px;overflow-x:auto;overflow-y:hidden;padding-bottom:6px;scrollbar-width:thin}
.cx{display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px 26px;padding-top:2px}
.gq .rs{position:relative}
.gq .win{position:absolute;left:0;right:0;top:calc(18px + var(--rh) / 2 - 22px);height:44px;border-top:1px solid var(--dim);border-bottom:1px solid var(--dim);pointer-events:none;opacity:.55}
.gq{display:flex;flex-direction:column}
.gq .gl{font-size:12px;letter-spacing:.08em;color:var(--dim);height:18px;padding-left:6px}
.gq .rs{display:flex}
.col{display:flex;flex-direction:column;align-items:stretch;transition:opacity .3s}
.col .rl{font-size:10.5px;letter-spacing:.07em;color:var(--dim);text-align:center;height:18px;white-space:nowrap;padding:0 4px;opacity:.8}
.ring{position:relative;height:var(--rh);min-width:72px;perspective:640px;cursor:grab;touch-action:none;outline:none;user-select:none;-webkit-user-select:none;
  -webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.ring:active{cursor:grabbing}
.col + .col .ring{border-left:1px solid var(--faint)}
.ring .drum{position:absolute;left:0;right:0;top:50%;height:0;transform-style:preserve-3d;will-change:transform}
.ring .it{position:absolute;left:0;right:0;top:-22px;height:44px;display:flex;align-items:center;justify-content:center;padding:0 12px;white-space:nowrap;font-size:18px;backface-visibility:hidden;color:var(--dim)}
.ring .it.c{color:var(--ink)}
.ring:focus-visible{box-shadow:inset 0 0 0 1px var(--dim)}
.ring.act .it{font-size:18.5px}
.cxout{margin-top:26px}
.hint{margin-top:34px;color:var(--dim);font-size:14px;max-width:46em;line-height:1.5}
/* map */
.mapc{font-size:clamp(18px,2.2vw,24px);line-height:1.8;margin-bottom:6px}
.mapc select{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--dim);padding:0 2px;cursor:pointer;max-width:100%}
.mapc select option{color:#000;font-size:15px}
.mapc .ph{color:var(--dim);font-style:italic}
.readout{min-height:2.4em;font-size:17px;margin:6px 0 16px;color:var(--dim)}
.readout b{font-weight:400;color:var(--ink)}.readout .vd{color:var(--vc)}
.grid{display:grid;gap:3px;font-size:13px}
.grid .top{grid-column:2 / -1;color:var(--dim);font-size:12.5px;letter-spacing:.06em;text-align:center;border-bottom:1px solid var(--faint);padding-bottom:4px;margin-bottom:2px}
.grid .side{color:var(--dim);font-size:12.5px;letter-spacing:.06em;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 10px 6px 0}
.grid .h{color:var(--dim);display:flex;align-items:flex-end;justify-content:center;text-align:center;padding:4px 2px;line-height:1.2}
.grid .rh{color:var(--dim);display:flex;align-items:center;justify-content:flex-end;padding-right:10px;text-align:right}
.grid .h.hl,.grid .rh.hl{color:var(--ink)}
.grid .cell{aspect-ratio:1.6;border-radius:3px;background:var(--vc);display:flex;align-items:center;justify-content:center;color:var(--bg);font-size:11.5px;cursor:pointer;text-align:center;line-height:1.1;padding:2px;transition:opacity .12s}
.grid:hover .cell{opacity:.5}.grid .cell.hl{opacity:.85}.grid .cell:hover{opacity:1;outline:1px solid var(--ink)}
.mnote{color:var(--dim);font-size:14px;font-style:italic;margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;font-size:13px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:2px;background:var(--vc);display:inline-block}
/* web */
.towebb{color:var(--ink)!important;border-bottom:1px solid var(--dim)}
.wtop{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-size:14px;margin-bottom:12px}
.wtop .wl{color:var(--dim)}.wjs{display:flex;flex-wrap:wrap;gap:4px 14px}.wjs button{color:var(--dim)}.wjs button[aria-pressed=true]{color:var(--ink);border-bottom:1px solid var(--dim)}
.wbox{position:relative;height:min(70vh,760px);margin:0 -32px;border-top:1px solid var(--faint);border-bottom:1px solid var(--faint);touch-action:none;cursor:grab;overflow:hidden}
.wbox.drag{cursor:grabbing}.wbox.pt{cursor:pointer}
.wbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.wmsg{position:absolute;left:0;right:0;top:46%;text-align:center;color:var(--dim);font-style:italic;pointer-events:none}
.wzoom{position:absolute;right:14px;bottom:12px;display:flex;gap:6px}
.wzoom button{min-width:30px;height:30px;padding:0 8px;border:1px solid var(--faint);border-radius:999px;background:var(--bg);color:var(--dim);font-size:14px}.wzoom button:hover{color:var(--ink);border-color:var(--dim)}
.winfo{margin-top:20px;min-height:9em;max-width:52em}
.winfo .ws{font-size:clamp(20px,2.4vw,26px);line-height:1.35}
.winfo .wv{font-size:22px;color:var(--vc);margin-top:6px}
.winfo .wm{color:var(--dim);font-size:14px;margin-top:6px}
.winfo .wr{margin-top:10px;font-size:15.5px;line-height:1.5}
.winfo .wb{margin-top:12px;display:flex;gap:18px;font-size:14px}.winfo .wb button{color:var(--dim)}.winfo .wb button:hover{color:var(--ink)}
.winfo .wi{color:var(--dim);font-size:15px;line-height:1.55}
/* chrome shared with the plain page */
.foot{position:fixed;left:18px;bottom:16px;z-index:19;font-size:13px;color:var(--dim);background:var(--bg);padding:4px 6px;border-radius:999px;display:flex;gap:7px}
.foot a{color:var(--dim);text-decoration:none}.foot a:hover{color:var(--ink)}.foot a.on{color:var(--ink);border-bottom:1px solid var(--faint)}
.credit{position:fixed;right:18px;bottom:16px;z-index:19;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);background:var(--bg);padding:4px 6px 4px 4px;border-radius:999px}.credit b{font-weight:400;color:var(--ink)}
.credit img{width:20px;height:20px;border-radius:50%;object-fit:cover}
@media (max-width:760px){.bar .lg{display:none}.wbox{margin:0 -18px;height:62vh}main{padding:22px 18px 120px}.bar{margin-bottom:30px}.cxw{--rh:176px}.grid{font-size:11px}.grid .cell{font-size:0}.more{grid-template-columns:1fr}.more .lab{text-align:left}
  .foot{left:0;right:0;bottom:0;border-radius:0;padding:11px 20px calc(11px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--faint)}.credit{bottom:8px;right:12px;background:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</section>

<section id="M" hidden>

})();

function show(w){ for(const [id, t] of [['B','tB'],['C','tC'],['M','tM'],['W','tW']]){ $(id).hidden = id !== w; $(t).setAttribute('aria-pressed', id === w); } if(w === 'B') drawB(); if(w === 'C') drawC(); if(w === 'M'){ if(S.a !== null) $('mAct').value = S.a; drawMap(); } if(w === 'W') WEB.open(); }
$('tW').onclick = () => show('W');
$('toweb').onclick = () => { show('W'); WEB.findAndFly(S.a, S.d, S.t, S.j); };
$('ctoweb').onclick = () => { show('W'); WEB.findAndFly(C.a, C.d, C.t, C.j); };
$('tB').onclick = () => show('B'); $('tC').onclick = () => show('C'); $('tM').onclick = () => show('M');
$('reset').onclick = () => { S = blank(); C = {d:blankP('adult', 'woman'), a:0, t:blankP('adult', 'man'), j:0}; lastV = null; SND.pop(); show('B'); };
drawB();
