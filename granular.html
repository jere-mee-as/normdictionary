function applyQ(){ const M = MOD[real()]; if(M._q !== QRY){ M._q = QRY; M.filter(QRY); } }
function setQ(raw){ F.value = raw; const q = nrm(raw.trim()); QRY = q.length > 1 ? q : ''; document.documentElement.classList.toggle('nohits', !!QRY && !totalHits()); applyQ(); if(!QRY) fhint(''); }
const F = $('find');
document.querySelectorAll('.nhback').forEach(b => b.onclick = () => { SND.tick(.8); setQ(''); });
F.addEventListener('input', () => setQ(F.value));
F.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); MOD[real()].enter(); } if(e.key === 'Escape'){ setQ(''); F.blur(); } });
addEventListener('keydown', e => { if(e.key === '/' && e.target !== F){ e.preventDefault(); F.focus(); } });
/* themes: auto follows the device; the rest are fixed palettes. The half-circle opens the list */
(function(){ const r = document.documentElement, box = $('themes');
  const TH = [['', 'auto', '#fff', '#111'], ['day', 'day', '#fff', '#111'], ['night', 'night', '#0b0b0b', '#ebebeb'], ['paper', 'paper', '#f5efe3', '#2b241d'],
    ['newsprint', 'newsprint', '#ecebe6', '#151515'], ['rose', 'rose', '#fbf1f2', '#3d1f27'], ['ink', 'ink', '#0f2240', '#e9eef6'], ['slate', 'slate', '#1b1f24', '#dfe3e8'], ['phosphor', 'phosphor', '#060b06', '#9cf29c']];
  const set = k => { if(k) r.dataset.theme = k; else delete r.dataset.theme; try { localStorage.setItem('sr-theme', k); } catch(e){} draw(); };
  try { const t = localStorage.getItem('sr-theme'); if(t === null) r.dataset.theme = 'ink'; else if(t && TH.some(x => x[0] === t)) r.dataset.theme = t; else delete r.dataset.theme; } catch(e){ r.dataset.theme = 'ink'; }
  function draw(){ box.innerHTML = ''; const cur = r.dataset.theme || ''; TH.forEach(([k, name, bg, ink]) => { const b = el('button'); b.setAttribute('aria-pressed', String(k === cur));
      const i = el('i', null, 'Aa'); i.style.background = bg; i.style.color = ink; b.append(i, name); b.onclick = () => { set(k); SND.tick(1.2); }; box.appendChild(b); }); }
  $('theme').onclick = e => { e.stopPropagation(); box.classList.toggle('on'); draw(); };
  addEventListener('pointerdown', e => { if(box.classList.contains('on') && !e.target.closest('#themes,#theme')) box.classList.remove('on'); }); })();
</script></body></html>
